<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">
</head>

<body>
    <main>
        <section>
            <form action="">
                <fieldset>
                    <legend>Inicio de sesión</legend>
                    <p>Ingresa tus credenciales para ingresar a tu cuenta</p>

                    <label for="">Correo electronico</label>
    
                        <input type="email" placeholder="Correo@example.com" required>

                        <label for="">Contraseñas</label>
                        <input type="password" placeholder="*********" required>

                        <label for="">Recordarme</label>
                        <input type="checkbox">

                        <input type="submit" value="Iniciar sesion">
                        <input type="reset" value="Limpiar">

                        <p class="enlace">¿No tienes una cuenta? <a href="registro.html">Registrate aqui</a></p>

                </fieldset>
        
            </form>

        </section>
    </main>
</body>
</html>
