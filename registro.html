<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="img/images.png">
</head>
<body>
    <main>
        <section>
            <form action="">
                <fieldset>
                    <legend>Crer una cuenta</legend>
                    <label for="">Nombre completo</label>
                    <input type="text" placeholder="juana perez" required>

                    <label for="">Género</label>
                    <div class=" grupo-radios">
                        <label for="">Femenino</label>
                        <input type="radio" value="femenino">

                        <label for="">Masculino</label>
                        <input type="radio" value="masculino">
                        <label for="">Otro</label>
                        <input type="radio" value="otro">
                    </div>
                    <label for="">Foto de perfil</label>
                    <input type="file" accept="image/*">

                    <label for="">Correo electronico</label>
                    <input type="email" placeholder="correo@example.com" required>

                    <label for="">Telefono</label>
                    <input type="tel" placeholder="+57 000 000 000">

                    <label for="">pais</label>
                    <select>
                        <option value="">Selecciona tu pais</option>
                        <option value="ar">Argentina</option>
                        <option value="col">Colombia</option>
                        <option value="mx">Mexico</option>
                        <option value="es">España</option>
                        <option value="otro">Otro</option>
                    </select>
                
                    <label for="">Contraseña</label>
                    <input type="password" placeholder="***********" required>

                    <label for="">Acepto los terminos y condiciones</label>
                    <input type="checkbox">

                    <label for="">Deseo recibir noticias por correo</label>
                    <input type="checkbox">

                    <input type="submit" value="Registrarme">
                    <input type="reset" value="Limpiar">

                    <p class="enlace">¿Ya tienes una cuenta? <a href="login.html">Inicia sesion aqui</a></p>

                </fieldset>




            </form>


        </section>



    </main>
</body>
</html>
